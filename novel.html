<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说阅读 · 结晶百相 · 科麦尔岛篇</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-logo" onclick="location.href='index.html'">结晶百相<small>100 Crystals</small></div>
  <div class="nav-links" id="navLinks">
    <a class="nav-link" href="index.html">首页</a>
    <a class="nav-link active" href="novel.html">小说阅读</a>
    <a class="nav-link" href="worldview.html">世界观百科</a>
    <a class="nav-link" href="characters.html">角色图鉴</a>
    <a class="nav-link" href="geography.html">地理设定</a>
    <a class="nav-link" href="shop.html">周边商城</a>
    <a class="nav-link" href="about.html">关于</a>
  </div>
  <div class="nav-search">
    <span class="nav-search-icon">🔍</span>
    <input type="text" id="navSearch" placeholder="搜索角色/地名/章节...">
    <div class="search-results" id="searchResults"></div>
  </div>
  <button class="theme-toggle" id="themeToggle">☾</button>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="main-content">
<div class="novel-layout">

<!-- 侧边章节目录 -->
<aside class="novel-sidebar" id="novelSidebar">
  <div class="novel-sidebar-title">章节目录 · 131章</div>
  <ul class="chapter-list" id="chapterList"></ul>
</aside>

<!-- 正文区 -->
<div class="novel-main">
  <!-- 阅读设置 -->
  <div class="reading-controls">
    <div class="control-group">
      <span class="control-label">字号</span>
      <button class="control-btn" data-font="14" onclick="setFontSize(14)">小</button>
      <button class="control-btn active" data-font="17" onclick="setFontSize(17)">中</button>
      <button class="control-btn" data-font="19" onclick="setFontSize(19)">大</button>
      <button class="control-btn" data-font="21" onclick="setFontSize(21)">特大</button>
    </div>
    <div class="control-group">
      <span class="control-label">行高</span>
      <button class="control-btn" data-line="1.6" onclick="setLineHeight(1.6)">紧凑</button>
      <button class="control-btn active" data-line="1.8" onclick="setLineHeight(1.8)">标准</button>
      <button class="control-btn" data-line="2.0" onclick="setLineHeight(2.0)">宽松</button>
    </div>
    <div class="control-group" style="margin-left:auto;">
      <button class="control-btn" id="sidebarToggle" onclick="toggleSidebar()" title="目录">☰</button>
    </div>
    <!-- ==========新增书签按钮组 ========== -->
    <div class="control-group">
        <button class="control-btn" onclick="addBookmark()" title="保存当前阅读位置">添加书签</button>
        <button class="control-btn" onclick="gotoBookmark()" title="跳转到书签位置">跳转书签</button>
        <button class="control-btn" onclick="clearBookmark()" title="清除保存的书签">清除书签</button>
    </div>
  </div>

  <!-- 章节内容 -->
  <article class="novel-content" id="novelContent">
    <p style="text-align:center;color:var(--text-dim);">正在加载小说内容...</p>
  </article>

  <!-- 章节导航 -->
  <div class="chapter-nav">
    <button class="chapter-nav-btn" id="prevChapter" onclick="changeChapter(-1)">← 上一章</button>
    <button class="chapter-nav-btn" id="nextChapter" onclick="changeChapter(1)">下一章 →</button>
  </div>
</div>

</div>
</div><!-- /main-content -->

<button class="scroll-top" id="scrollTop">↑</button>
<script src="js/common.js"></script>
<script src="js/novel.js"></script>
<script>
/**
 * 书签功能【修复版】
 * 从DOM读取data‑chapter‑id，规避全局变量名错误；解析损坏自动清理脏数据
 */

// 保存书签：从dom读取章节id
function addBookmark(){
  const chapterDom = document.querySelector(".novel-content[data-chapter-id]");
  if(!chapterDom){
    alert("暂未加载章节，无法添加书签");
    return;
  }
  const chapId = chapterDom.dataset.chapterId;
  const scrollY = window.scrollY;
  const bookmarkData = {
    chapterId: chapId,
    scrollPos: scrollY
  };
  localStorage.setItem("novelBookmark", JSON.stringify(bookmarkData));
  alert("✅书签已保存！");
  renderBookmarkMarker(); // 新增：更新目录书签标记
}

// 跳转书签
function gotoBookmark(){
  const raw = localStorage.getItem("novelBookmark");
  if(!raw){
    alert("暂无保存的书签");
    return;
  }
  let bm;
  try{
    bm = JSON.parse(raw);
  }catch(e){
    // JSON解析失败，自动删除损坏数据
    localStorage.removeItem("novelBookmark");
    alert("书签数据已损坏，已自动清除，请重新添加书签");
    return;
  }

  // 校验书签字段完整性
  if(!bm || !bm.chapterId || bm.scrollPos === undefined){
    localStorage.removeItem("novelBookmark");
    alert("书签数据无效，已自动清除，请重新添加书签");
    return;
  }

  const chapterDom = document.querySelector(".novel-content[data-chapter-id]");
  const currentId = chapterDom?.dataset.chapterId;

  if(currentId === bm.chapterId){
    window.scrollTo({top:bm.scrollPos, behavior:"smooth"});
  }else{
    jumpToChapterId(Number(bm.chapterId));
    setTimeout(()=>{
      window.scrollTo({top:bm.scrollPos, behavior:"smooth"});
    },450);
  }
}

// 清除书签
function clearBookmark(){
  localStorage.removeItem("novelBookmark");
  renderBookmarkMarker(); //清除书签后，移除目录标记
  alert("🗑书签已清除");
}

// 页面加载完成自动恢复书签
window.addEventListener('load',()=>{
  const raw = localStorage.getItem("novelBookmark");
  if(!raw) return;
  let bm;
  try{
    bm = JSON.parse(raw);
  }catch(e){
    localStorage.removeItem("novelBookmark");
    console.log("自动清理损坏书签",e);
    return;
  }
  if(!bm || !bm.chapterId) return;

  setTimeout(()=>{
    jumpToChapterId(Number(bm.chapterId));
    setTimeout(()=>{
      window.scrollTo({top:bm.scrollPos, behavior:"smooth"});
    },450);
  },300);
  renderBookmarkMarker(); //页面加载时先渲染一次标记
})
/**
 * 渲染侧边目录的书签⭐标记
 */
function renderBookmarkMarker() {
  const raw = localStorage.getItem("novelBookmark");
  // 1. 先清除所有章节条目上旧的书签标记
  document.querySelectorAll('.chapter-item').forEach(item => {
    // 移除已有的⭐符号
    item.innerHTML = item.innerHTML.replace(/ ⭐$/, '');
  });

  if (!raw) return; // 没有书签，直接退出

  try {
    const bm = JSON.parse(raw);
    const bookmarkChapterId = bm.chapterId;
    // 找到目录里data-ch等于书签章节id的章节项
    const targetItem = document.querySelector(`.chapter-item[data-ch="${bookmarkChapterId}"]`);
    if(targetItem){
      // 在章节文字末尾追加⭐标记
      targetItem.innerText += " ⭐";
    }
  } catch(e) {
    console.log("书签标记渲染失败",e);
  }
}
</script>
</body>
</html>
