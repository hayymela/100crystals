<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小说阅读 · 结晶百相 · 科麦尔岛篇</title>
<link rel="icon" href="assets/logo.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <div class="nav-logo" onclick="location.href='index.html'">结晶百相<small>100 Crystals</small></div>
  <div class="nav-links" id="navLinks">
    <a class="nav-link" href="index.html">首页</a>
    <a class="nav-link active" href="novel.html">小说阅读</a>
    <a class="nav-link" href="worldview.html">世界观百科</a>
    <a class="nav-link" href="characters.html">角色图鉴</a>
    <a class="nav-link" href="geography.html">地理设定</a>
    <a class="nav-link" href="factions.html">势力阵营</a>
    <a class="nav-link" href="about.html">关于</a>
  </div>
  <div class="nav-search">
    <span class="nav-search-icon">🔍</span>
    <input type="text" id="navSearch" placeholder="搜索角色/地名/章节...">
    <div class="search-results" id="searchResults"></div>
  </div>
  <button class="theme-toggle" id="themeToggle">☾</button>
  <div class="hamburger" id="hamburger"><span></span><span></span><span></span></div>
</nav>

<div class="main-content">
<div class="novel-layout">

<!-- 侧边章节目录 -->
<aside class="novel-sidebar" id="novelSidebar">
  <div class="novel-sidebar-title">章节目录 · 26章</div>
  <ul class="chapter-list" id="chapterList"></ul>
</aside>

<!-- 正文区 -->
<div class="novel-main">
  <!-- 阅读设置 -->
  <div class="reading-controls">
    <div class="control-group">
      <span class="control-label">字号</span>
      <button class="control-btn" data-font="14" onclick="setFontSize(14)">小</button>
      <button class="control-btn active" data-font="17" onclick="setFontSize(17)">中</button>
      <button class="control-btn" data-font="19" onclick="setFontSize(19)">大</button>
      <button class="control-btn" data-font="21" onclick="setFontSize(21)">特大</button>
    </div>
    <div class="control-group">
      <span class="control-label">行高</span>
      <button class="control-btn" data-line="1.6" onclick="setLineHeight(1.6)">紧凑</button>
      <button class="control-btn active" data-line="1.8" onclick="setLineHeight(1.8)">标准</button>
      <button class="control-btn" data-line="2.0" onclick="setLineHeight(2.0)">宽松</button>
    </div>
    <div class="control-group" style="margin-left:auto;">
      <button class="control-btn" id="sidebarToggle" onclick="toggleSidebar()" title="目录">☰</button>
    </div>
  </div>

  <!-- 章节内容 -->
  <article class="novel-content" id="novelContent">
    <p style="text-align:center;color:var(--text-dim);">正在加载小说内容...</p>
  </article>

  <!-- 章节导航 -->
  <div class="chapter-nav">
    <button class="chapter-nav-btn" id="prevChapter" onclick="changeChapter(-1)">← 上一章</button>
    <button class="chapter-nav-btn" id="nextChapter" onclick="changeChapter(1)">下一章 →</button>
  </div>
</div>

</div>
</div><!-- /main-content -->

<button class="scroll-top" id="scrollTop">↑</button>
<script src="js/common.js"></script>
<script src="js/novel.js"></script>
</body>
</html>
